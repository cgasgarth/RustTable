notes = "The leaf accepts an explicit render context, but deriving scale, export precision/channel flags, preview/thumbnail state, display-referred profile format, and fast-pipe selection from immutable production snapshots is not changed here. The alternate two-row fast implementation is not claimed by this scalar leaf."

