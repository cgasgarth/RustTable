production_registration = "typed source-stage segment only; generic linear-RGB registry remains untouched"

[[responsibility]]
id = "native-parameter-abi"
upstream_path = "src/iop/rawprepare.c"
upstream_symbols = ["DT_MODULE_INTROSPECTION(2)", "dt_iop_rawprepare_params_t", "dt_iop_rawprepare_params_v1_t"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/codec.rs"
status = "replaced"
notes = "The native v1 declaration is 28 bytes and v2 is 32 bytes, including the native v1 padding and v2 flat-field field. History slots retain 296-byte v1 and 40-byte v2 payloads; opaque tails are preserved and never interpreted."

[[responsibility]]
id = "legacy-migration"
upstream_path = "src/iop/rawprepare.c"
upstream_symbols = ["legacy_params"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/codec.rs"
status = "replaced"
notes = "v1 copies the complete native prefix into v2 and forces FLAT_FIELD_OFF; unknown versions remain opaque and non-executable."

[[responsibility]]
id = "raw-metadata-route"
upstream_path = "src/common/image.h; src/common/image.c; src/imageio/imageio_rawspeed.h"
upstream_symbols = ["DT_IMAGE_RAW", "DT_IMAGE_S_RAW", "DT_IMAGE_HDR", "dt_image_is_rawprepare_supported", "_image_is_normalized"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/{execution.rs,source_map.rs}"
status = "bounded-leaf"
notes = "The typed adapter accepts only a decoded one-channel U16 Bayer/X-Trans RAW mosaic. Non-RAW, SRAW, floating-point RAW, normalized float, and unknown layouts fail closed before route or plan publication."

[[responsibility]]
id = "crop-and-level-commit"
upstream_path = "src/iop/rawprepare.c"
upstream_symbols = ["_image_set_rawcrops", "commit_params", "output_format"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/execution.rs"
status = "replaced"
notes = "Crop validity preserves the native nonnegative and less-than-half-dimension rule. Bayer/X-Trans use separate four-filter black levels and publish the rounded average black level plus white point."

[[responsibility]]
id = "bayer-xtrans-cfa"
upstream_path = "src/iop/rawprepare.c; src/imageio/imageio_rawspeed.h"
upstream_symbols = ["_BL", "_adjust_xtrans_filters", "dt_rawspeed_crop_dcraw_filters"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/execution.rs"
status = "replaced"
notes = "The operation preserves source parity, exposes cropped CFA phase, and rotates the six-by-six X-Trans table by the crop."

[[responsibility]]
id = "cpu-raster"
upstream_path = "src/iop/rawprepare.c"
upstream_symbols = ["process"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/execution.rs"
status = "bounded-leaf"
notes = "The one-channel U16 mosaic branch retains row-major indexing, unclipped residuals, per-filter normalization, finite-output rejection, row cancellation polling, and all-or-nothing output publication. SRAW and floating-point branches are explicitly deferred."

[[responsibility]]
id = "typed-source-registration"
upstream_path = "src/iop/rawprepare.c"
upstream_symbols = ["name", "flags", "default_colorspace", "process"]
rust_path = "crates/rusttable-processing/src/{operation/mod.rs,graph.rs,operations/rawprepare/source_map.rs,registry/operations/mod.rs}"
status = "replaced"
notes = "Raw Prepare is registered as rusttable.rawprepare.source at the raw-sensor-linear stage with raw-u16-mosaic to raw-f32-mosaic types. It is deliberately absent from the generic LinearRgb operation registry and from generic ImagePredicate routing."

[[responsibility]]
id = "unsupported-native-seams"
upstream_path = "src/iop/rawprepare.c; src/common/dng_opcode.h; data/kernels/basic.cl"
upstream_symbols = ["_check_gain_maps", "dt_dng_gain_map_t", "dt_opencl_*", "dt_dev_write_scharr_mask", "gui_init", "init_presets"]
rust_path = "crates/rusttable-processing/src/operations/rawprepare/source_map.rs"
status = "explicitly-deferred"
notes = "Gain-map materialization, GPU, detail-mask publication, generic history routing, decoder/camera metadata acquisition, presets, and GTK remain unavailable. No substitute behavior is registered."
