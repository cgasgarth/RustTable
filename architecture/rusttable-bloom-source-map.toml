rust_path = "crates/rusttable-processing/src/operations/bloom/leaf.rs"
status = "bounded-leaf"
notes = "The v1 payload is exactly three little-endian IEEE-754 floats at offsets 0, 4, and 8 in declaration order: size, threshold, strength. The 12-byte typed codec preserves every source bit pattern. BloomConfig rejects only nonfinite values: native commit_params copies every finite f32 verbatim, while 0..100 remains descriptor/UI metadata rather than a commit constraint. BloomPlan separately rejects a finite size only when its source-ordered signed computation would produce a negative or invalid box-filter radius."

