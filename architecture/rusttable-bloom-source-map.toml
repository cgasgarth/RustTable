id = "native-release-arithmetic-profile"
upstream_path = "packaging/macosx/BUILD_hb.txt; packaging/macosx/2_build_hb_darktable_default.sh; build.sh; DefineOptions.cmake; cmake/march-mtune.cmake; src/CMakeLists.txt; src/iop/CMakeLists.txt; src/common/math.h; src/iop/bloom.c"
upstream_symbols = ["Option A", "--build-type Release", "BUILD_TYPE_DEFAULT=RelWithDebInfo", "BINARY_PACKAGE_BUILD", "MARCH", "CMAKE_C_FLAGS_RELEASE", "add_iop(bloom)", "#else __FAST_MATH__", "process"]
rust_path = "crates/rusttable-processing/src/operations/bloom/leaf.rs; architecture/rusttable-numerics.toml"
status = "bounded-leaf"
notes = "BUILD_hb.txt names the default package script as Option A. packaging/macosx/2_build_hb_darktable_default.sh is the selected script and explicitly passes Release, overriding build.sh's RelWithDebInfo default. DefineOptions.cmake leaves BINARY_PACKAGE_BUILD=OFF, so cmake/march-mtune.cmake probes -march=native for AppleClang, with -mtune=native then -mtune=generic fallbacks. src/CMakeLists.txt appends ${MARCH} and -g to generic C flags, then appends -O3, the fast-math enable option spelled by joining -f and fast-math, and finally -fno-finite-math-only to Release C flags. Under Apple Clang that final option leaves __FAST_MATH__ undefined, and src/common/math.h therefore selects its non-fast dt_fast_hypotf branch calling hypotf; Bloom does not call that helper. The scripts do not pin the Apple Clang version or host CPU, so the leaf does not infer a general __FAST_MATH__ profile. It models only the selected compiler output intentionally captured here: folded f64 radius and reciprocal-exp2 arithmetic plus two ordered screen FMAs. Explicit Rust helpers reproduce those choices in every Cargo profile; the numerics registry marks the screen contraction ExplicitFused, and hard-coded tests pin strength bits 0x3f80e3eb plus mix bits 0x42ad2ec0 against strict-rounding discriminators."

