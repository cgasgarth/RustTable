notes = "The log path retains the 2^-16 floor and native fastlog2 bit approximation; gamma uses bounded LUT indices and exponential extrapolation. Native CPU gamma leaves lane four unwritten outside mask display, which safe Rust cannot publish; the leaf preserves lane four following native OpenCL and mask-display behavior and records final pixelpipe alpha/spare ownership as deferred."

