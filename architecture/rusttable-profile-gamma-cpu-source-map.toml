status = "bounded-leaf"
notes = "The 65536-entry LUT retains native branches and explicit C operand boundaries: in the linear<1 branch, unsuffixed 1.0 promotes the surrounding g/a expressions to double while gamma*linear and linear*(g-1) remain f32 subexpressions before assignment narrowing. The focused test has a non-default LUT golden for the resulting bits, plus explicit f32 powf and mul_add boundaries. Exponential coefficients retain source accumulation order."

