[[responsibility]]
id = "native-parameter-abi"
upstream_path = "src/iop/rgblevels.c"
upstream_symbols = ["DT_MODULE_INTROSPECTION(1)", "dt_iop_rgblevels_params_t"]
rust_path = "crates/rusttable-processing/src/operations/rgblevels/mod.rs"
status = "replaced"
notes = "The current native payload is 44 bytes: autoscale i32 at offset 0, preserve_colors i32 at offset 4, and levels[3][3] as nine f32 values at offset 8. Shared architecture metadata now records the verified 44-byte v1 payload with a typed decoder instead of the stale opaque 20-byte declaration."

[[responsibility]]
id = "native-defaults-and-history"
upstream_path = "src/iop/rgblevels.c"
upstream_symbols = ["init", "DT_MODULE_INTROSPECTION defaults"]
rust_path = "crates/rusttable-processing/src/operations/rgblevels/mod.rs"
status = "replaced"
notes = "Defaults are linked channels, luminance preservation, and three copies of [0.0, 0.5, 1.0]. The module starts disabled; CMake DEFAULT_VISIBLE controls default listing visibility independently of activation. v1 is the only known version; there is no legacy_params migration. Unknown versions remain byte-preserved opaque values and cannot materialize."

[[responsibility]]
id = "commit-lut-and-channel-expansion"
upstream_path = "src/iop/rgblevels.c"
upstream_symbols = ["commit_params", "_compute_lut"]
rust_path = "crates/rusttable-processing/src/operations/rgblevels/mod.rs"
status = "replaced"
notes = "Linked mode copies channel 0 levels into all three effective channels. LUT construction preserves the native 65536-entry table, double-precision pow calls narrowed to f32, and inv_gamma calculation order."

[[responsibility]]
