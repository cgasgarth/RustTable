[[responsibility]]
id = "rgb-norm-and-profile-boundary"
upstream_path = "src/common/rgb_norms.h; src/common/colorspaces_inline_conversions.h; src/common/iop_profile.h"
upstream_symbols = ["dt_rgb_norm", "dt_camera_rgb_luminance", "dt_ioppr_get_rgb_matrix_luminance"]
rust_path = "crates/rusttable-processing/src/operations/rgblevels/mod.rs"
status = "replaced"
notes = "All seven native norm IDs are represented. Missing work-profile evidence follows the native camera-luminance fallback; explicit profile evidence preserves optional TRC LUT/exponential evaluation and matrix row-one arithmetic. ICC acquisition and ownership remain outside this leaf."

[[responsibility]]
id = "alpha-and-format-boundary"
upstream_path = "src/iop/rgblevels.c; src/common/dttypes.h; src/develop/imageop.h; src/develop/imageop.c"
upstream_symbols = ["dt_iop_have_required_input_format", "process", "for_each_channel", "copy_pixel_nontemporal"]
rust_path = "crates/rusttable-processing/src/operations/rgblevels/mod.rs"
status = "replaced"
notes = "The native CPU equations semantically read and write RGB only. Its adaptive for_each_channel loop may also touch a fourth SIMD-padding lane, but copy_pixel_nontemporal explicitly says that subsequent code must ignore that value unless alpha is set afterward; this non-distorting IOP does not set it. The safe bounded destination leaves its fourth lane deterministically zero on direct, linked-above-black, and linked-below-black paths without reading the input lane. A required-format failure uses fallible private copy-through before processing. The retained GPU oracle copies alpha and is not claimed by this CPU leaf."

[[responsibility]]
id = "cancellation-publication"
upstream_path = "src/iop/rgblevels.c"
rust_path = "crates/rusttable-processing/src/operations/rgblevels/mod.rs"
status = "bounded-leaf"
notes = "Native OpenMP has no cancellation contract. Rust polls before and during the pixel loop, keeps output private, and returns no partial result on cancellation."

