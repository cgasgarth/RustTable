schema = "rusttable.filmic-compat-source-map.v1"
# Operation-local lineage for the bounded legacy filmic CPU leaf.  The pinned
# source metadata is kept even though retained files are a read-only oracle.
upstream_repository = "darktable-org/darktable"
upstream_commit = "d8628e8103989bc4ef06dbfb9fd01f3809f884bf5"

[operation]
compatibility_id = "filmic"
rust_id = "rusttable.filmic"
native_module_version = 3
native_boundary = "lab-d50"
default_enabled = false

[sources]
module = "src/iop/filmic.c"
color_conversions = "src/common/colorspaces_inline_conversions.h"
types = "src/common/dttypes.h"
math = "src/common/math.h"
imageop = "src/develop/imageop.h"
draw = "src/gui/draw.h"
curve = "src/common/curve_tools.c"
curve_header = "src/common/curve_tools.h"
opencl = "data/kernels/filmic.cl"

[abi]
v1_bytes = 52
v2_bytes = 56
v3_bytes = 60
migration = "v1/v2 direct to v3; global_saturation defaults to 100; v1 preserve_color defaults to 0"

[capabilities]
cpu = true
gpu_tier = "none"
deterministic_gpu = false
identity_roi = true
overlap_pixels = 0
operation_mask_input = false
operation_mask_output = false
fallback_to_cpu = false
shared_registry = false
ui = "unavailable"

