notes = "The standalone leaf consumes the existing RasterDimensions, LabD50, and descriptor value contracts without editing their shared owners."

[[responsibility]]
id = "opencl-host-and-kernel"
upstream_path = "src/iop/colorcontrast.c; data/kernels/extended.cl; data/kernels/common.h"
upstream_symbols = ["process_cl", "init_global", "cleanup_global", "colorcontrast", "sampleri"]
