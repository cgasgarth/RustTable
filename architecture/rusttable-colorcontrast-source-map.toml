upstream_symbols = ["history materialization", "operation order", "registry", "pixelpipe CPU and GPU dispatch", "snapshot identity", "import", "application editing", "UI"]
rust_path = "crates/rusttable-processing/src/operations/colorcontrast/source_map.rs"
