native_pipe_cleanup = "cleanup_pipe frees piece->data and immediately assigns NULL; piece owns the allocation from init_pipe through cleanup_pipe"
native_execution_owner = "process borrows restrict input/output buffers under DT_IS_ALIGNED cache-line assumptions, reads immutable piece->data, and uses DT_OMP_FOR static OpenMP scheduling when enabled; emitted arithmetic remains compiler/profile dependent"
native_pixelpipe_buffer_size_owner = "src/develop/pixelpipe_hb.c derives default four-channel Lab bpp=16 and requested cacheline payload bpp*width*height, checks DT_CACHELINE_BYTES alignment, and dispatches borrowed pointers to process"
