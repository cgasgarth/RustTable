native_default_callback_owner = "src/common/module_api.h resolves omitted DEFAULT symbols to default_* functions; format.c, tiling.c, and imagebuf.c own the relevant shared default behavior"
rust_parameter_owner = "ColorCorrectionConfig owns validated raw f32 bits without canonicalizing signed zero"
rust_pipe_lifetime = "ColorCorrectionPlan owns committed coefficients and dimensions by value; construction initializes every field and Rust drop releases the value without a nullable allocation"
rust_execution_owner = "execution borrows typed four-channel input, applies the documented SeparateRoundings adaptation, serially builds an ordinary-Vec private candidate at ColorCorrectionPixel's lower required alignment, and publishes only a complete finite result"
rust_signed_zero_scope = "raw history/config and committed coefficient bits remain exact, L and channel four are copied bit-for-bit, and opponent outputs use the signs produced by the separate f32 operations; no broader optimized-native signed-zero equivalence is claimed"
shared_wrong_format_owner = "shared format/pixelpipe integration must own MIN-channel ROI copy-through, zero padding/cropping, trouble publication, and false return; the bounded leaf does not implement it"
native_tiling_owner = "retained default_tiling_callback owns factor/factor_cl=2 for identity ROI, maxbuf/maxbuf_cl=1, overhead=0, overlap=0, and upper-left coordinate align=1; that align field is unrelated to DT_IS_ALIGNED memory alignment, and Color Correction supplies no override"
rust_tiling_policy_owner = "the bounded leaf owns the additive one-raster transactional staging multiplier and the minimum/preferred tile edges; coordinate alignment 1 and preferred edge 256 are Rust tile policy, not a memory-alignment claim"
rust_budget_owner = "ColorCorrectionPlan charges its caller-provided budget only for the one-raster private candidate payload using checked integer arithmetic, with zero alignment-padding or allocator-metadata bytes; borrowed input and caller destination correspond to the native factor-2 allocation already present"
native_ui_precision_owner = "src/develop/imageop_gui.c derives digits only for the generated saturation slider; src/iop/colorcorrection.c owns hia/hib/loa/lob as custom-grid coordinates with no numeric control precision"
rust_endpoint_precision_owner = "the local descriptor uses precision 0 solely because ParameterDescriptor requires a value; endpoint GTK and any eventual numeric representation remain explicitly deferred"

