  "a_base = loa",
  "b_scale = (hib - lob) / 100.0",
  "b_base = lob",
  "out.L = in.L",
  "out.a = saturation * (in.a + in.L * a_scale + a_base)",
  "out.b = saturation * (in.b + in.L * b_scale + b_base)",
  "out.channel4 = in.channel4",
