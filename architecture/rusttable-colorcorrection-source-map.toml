  "non-finite committed scales fail plan construction",
  "mixed f32-subtract/double-divide/f32-narrow coefficient discriminator and separate-rounding Lab golden bits",
  "Debug -O0/_DEBUG, default RelWithDebInfo, and Release additions are inventoried while the hia=0x40f3f724/loa=0xbd4957c7/saturation=0x4023832c/L=0x42c3c571/a=0xc2b3cff2 Rust profile discriminator produces chosen a=0xc352a2c4 rather than contracted a=0xc352a2c3",
  "pixelpipe_hb derives 16-byte-per-pixel cache requests and enforces 64/128-byte alignment; pixelpipe_cache owns aligned allocation, payload-size accounting, replacement, failure, and cleanup",
  "generic aligned-allocation tail maxima 127/63 tighten to 112/48 for 16-byte-multiple Color Correction rasters, while the serial ordinary-Vec Rust adaptation requires only four-byte alignment",
  "native host-fit evaluates f32 before size_t conversion; the 4097x4097 factor-two boundary yields 537133056 native bytes versus 537133088 checked-integer bytes",
  "native and Rust payload budgets add zero alignment padding while the native POSIX Debug branch requests one extra cache line",
  "only saturation receives native two-digit Bauhaus precision; custom-grid endpoints have no native numeric precision and descriptor precision zero is explicitly deferred Rust policy",
  "lightness and channel four are preserved",
  "dimension, destination, non-finite input, and non-finite output failures",
  "literal 1024 cancellation polling before work, during processing, and after private processing",
  "size overflow and deterministic allocation-budget failure leave destination unchanged",
