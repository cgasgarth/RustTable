rust_path = "crates/rusttable-processing/src/operations/levels/execution.rs"
status = "implemented"
notes = "The four-channel histogram layout uses L at bins[4 * i]. Manual scan uses 256 bins and / (4 * 256); automatic resolution uses the native 16384-bin percentile thresholds and -FLT_MAX marker. Both signed FLT_MAX sentinels are rejected before LUT construction when black, gray, or white remains unresolved. GUI hash/preview synchronization remains deferred."

