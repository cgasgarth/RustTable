status = "implemented"
notes = "The CPU leaf keeps the native L/100 input, base-10 inverse-gamma, 0x10000 LUT without a 1.0 endpoint, fallback powf branch, 0.01 denominator guard, and a/b rescale. Alpha/spare is passed through because native CPU does not transform it; profile conversion is outside this leaf."

